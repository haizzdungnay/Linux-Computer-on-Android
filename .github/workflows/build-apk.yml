name: Build Standalone Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'scripts/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Sync bundled desktop scripts into Android assets
        run: |
          mkdir -p android/app/src/main/assets/scripts
          cp -f scripts/configure-tablet-xfce.py scripts/style-tablet-xfce.py \
            scripts/whitesur-tablet-xfce.py scripts/whitesur-panel.css \
            scripts/xfce-effects.py scripts/picom-xrender.conf \
            scripts/firefox-tablet.py scripts/linux-desktop-effects-on.desktop \
            scripts/linux-desktop-effects-off.desktop \
            scripts/minimal-launcher/tablet-session.sh \
            scripts/minimal-launcher/tablet-power.py \
            scripts/minimal-launcher/linux-workstation-power.desktop \
            scripts/minimal-launcher/com.microsoft.VSCode.desktop \
            scripts/minimal-launcher/synaptic.desktop \
            android/app/src/main/assets/scripts/
      - name: Run unit tests and build debug APK
        working-directory: android
        run: gradle testDebugUnitTest assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: linux-desktop-standalone-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
