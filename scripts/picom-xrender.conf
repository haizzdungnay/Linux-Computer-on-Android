# Debian trixie Picom 12.5, Termux:X11 screen :2.0.
backend = "xrender";
vsync = false;
use-damage = true;
blur-method = "none";
shadow-radius = 12;
shadow-offset-x = -12;
shadow-offset-y = -8;
shadow-opacity = 0.43;

rules = (
    {
        match = "(window_type = 'normal' || window_type = 'dialog') && !override_redirect && !fullscreen";
        shadow = true;
        animations = (
            {
                triggers = ["open"];
                opacity = { start = "window-raw-opacity-before"; end = "window-raw-opacity"; duration = 0.15; };
                shadow-opacity = "opacity";
            },
            {
                triggers = ["close"];
                opacity = { start = "window-raw-opacity-before"; end = 0; duration = 0.15; };
                shadow-opacity = "opacity";
            }
        );
    },
    {
        match = "window_type = 'dock' && class_g = 'Xfce4-panel'";
        opacity = 0.94;
        clip-shadow-above = true;
    }
);
