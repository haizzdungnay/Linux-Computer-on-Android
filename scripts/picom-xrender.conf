# Debian trixie Picom 12.5, Termux:X11 screen :2.0.
backend = "xrender";
vsync = false;
# XRender blur on Termux:X11 can leave stale strips after partial redraws.
use-damage = false;
blur-method = "gaussian";
blur-size = 9;
blur-deviation = 4.0;
shadow-radius = 24;
shadow-offset-x = -24;
shadow-offset-y = -15;
shadow-opacity = 0.62;

rules = (
    {
        match = "window_type != 'dock' || class_g != 'Xfce4-panel'";
        blur-background = false;
    },
    {
        match = "class_g = 'Thunar' && window_type = 'normal' && !fullscreen && !(_NET_WM_STATE@[*] = '_NET_WM_STATE_MAXIMIZED_VERT' && _NET_WM_STATE@[*] = '_NET_WM_STATE_MAXIMIZED_HORZ')";
        opacity = 0.91;
        blur-background = true;
    },
    {
        match = "(((window_type = 'normal' || window_type = 'dialog') && !override_redirect) || window_type *= 'menu' || window_type = 'tooltip') && !fullscreen";
        shadow = true;
        corner-radius = 12;
        animations = (
            {
                triggers = ["open", "show"];
                opacity = { start = "window-raw-opacity-before"; end = "window-raw-opacity"; duration = 0.15; };
                shadow-opacity = "opacity";
            },
            {
                triggers = ["close", "hide"];
                opacity = { start = "window-raw-opacity-before"; end = 0; duration = 0.15; };
                shadow-opacity = "opacity";
            }
        );
    },
    {
        match = "window_type *= 'menu' || window_type = 'tooltip'";
        corner-radius = 7;
    },
    {
        match = "fullscreen || (_NET_WM_STATE@[*] = '_NET_WM_STATE_MAXIMIZED_VERT' && _NET_WM_STATE@[*] = '_NET_WM_STATE_MAXIMIZED_HORZ')";
        corner-radius = 0;
        shadow = false;
    },
    {
        match = "window_type = 'dock' && class_g = 'Xfce4-panel' && height >= 24";
        blur-background = true;
        clip-shadow-above = true;
    },
    {
        # Match the bottom dock and skip its auto-hide trigger strip.
        match = "window_type = 'dock' && class_g = 'Xfce4-panel' && y > 0 && height >= 24";
        shadow = true;
        corner-radius = 16;
    }
);
